<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e1b2e'/><circle cx='50' cy='46' r='24' fill='%23f5a97f'/><path d='M0 78 30 52 52 70 74 48 100 76V100H0Z' fill='%23181526'/></svg>">
<style>
/* The wallpaper is drawn in code (SVG) – no image files, nothing to license.
   Palettes live in the [data-wp] blocks below; add your own. */
:root,:root[data-wp=dusk]{
  --sky1:#1a1633;--sky2:#5b3f7a;--sky3:#f0936b;--sun1:#ffd08a;--sun2:#ff7b8a;
  --r0:#6d4a86;--r1:#52396f;--r2:#3a2a5a;--r3:#271d44;--r4:#171230;--star:#fff4e0;
  --text:#ece6f5;--muted:#a79fc0;--accent:#f5a97f;--accent2:#c6a0f6;--green:#a6e3a1;--blue:#8aadf4;--pink:#f5bde6;
  --panel:rgba(22,18,40,.62);--line:rgba(236,230,245,.14);--ink:#171230}
:root[data-wp=moss]{
  --sky1:#0e1a17;--sky2:#2f4a3c;--sky3:#d9b26f;--sun1:#f6e3a8;--sun2:#e0a458;
  --r0:#4d6b52;--r1:#3b5642;--r2:#2b4234;--r3:#1d3026;--r4:#111f19;--star:#f4eed6;
  --text:#e9efdf;--muted:#a3b39f;--accent:#e0b861;--accent2:#9fcf9a;--green:#b8d98b;--blue:#8fc1c9;--pink:#e8a79a;
  --panel:rgba(15,28,22,.64);--line:rgba(233,239,223,.15);--ink:#111f19}
:root[data-wp=ink]{
  --sky1:#e9dcc3;--sky2:#efc9a6;--sky3:#e98a68;--sun1:#c8402f;--sun2:#c8402f;
  --r0:#b5776b;--r1:#8f5a55;--r2:#6a4348;--r3:#472e38;--r4:#2c1d2a;--star:#fff;
  --text:#2b1d26;--muted:#6e5560;--accent:#b8321f;--accent2:#6a4a8c;--green:#4d7a46;--blue:#3b6ea5;--pink:#b8475f;
  --panel:rgba(250,240,224,.7);--line:rgba(43,29,38,.2);--ink:#fff}
:root{--mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;--head:var(--mono);--fs:14px;
  --rad:14px;--pill:999px;--bw:1px;--bs:solid;--shadow:0 18px 50px rgba(0,0,0,.28);--blur:16px;--clip:none;--grain:.14}

/* ---- more themes: each sets colors plus shape/type variables; its artwork is drawn in paint() ---- */
:root[data-wp=matrix]{
  --sky1:#000a03;--sky2:#001a08;--sky3:#003a14;--text:#b9ffc8;--muted:#5fae77;--accent:#00ff66;--accent2:#7dffb0;--green:#00ff66;--blue:#3be0a0;--pink:#9dffb8;
  --panel:rgba(0,12,4,.74);--line:rgba(0,255,102,.3);--ink:#001a08;--rad:2px;--pill:3px;--shadow:0 0 22px rgba(0,255,102,.14);--blur:3px;--grain:.06}
:root[data-wp=minimal]{
  --mono:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fs:14px;
  --sky1:#f7f7f4;--text:#141414;--muted:#7a7a75;--accent:#141414;--accent2:#555;--green:#8a8a85;--blue:#b3b3ad;--pink:#d4d4ce;
  --panel:rgba(255,255,255,.86);--line:#e2e2dc;--ink:#fff;--rad:8px;--pill:8px;--shadow:none;--blur:0px;--grain:0}
:root[data-wp=artist]{
  --mono:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--fs:16px;
  --sky1:#f3ead8;--text:#231a14;--muted:#7a6a5a;--accent:#d94f30;--accent2:#2b59c3;--green:#3a8f6b;--blue:#2b59c3;--pink:#e8a0b4;
  --panel:rgba(255,250,238,.82);--line:rgba(35,26,20,.24);--ink:#fff8ec;--rad:3px;--pill:4px;--shadow:7px 7px 0 rgba(35,26,20,.14);--blur:2px;--grain:.1}
:root[data-wp=cyber]{
  --sky1:#07030f;--text:#e7f7ff;--muted:#8aa0c8;--accent:#ff2bd6;--accent2:#00f0ff;--green:#f5ff3a;--blue:#00f0ff;--pink:#ff2bd6;
  --panel:rgba(12,6,28,.76);--line:rgba(0,240,255,.38);--ink:#07030f;--rad:0;--pill:0;--shadow:0 0 28px rgba(255,43,214,.16);--blur:6px;--grain:.08;
  --clip:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
:root[data-wp=medieval]{
  --mono:"Palatino Linotype",Palatino,"Book Antiqua","Iowan Old Style",Georgia,serif;--fs:16px;
  --sky1:#e8d5a8;--sky2:#d9bf86;--sky3:#c9a566;--text:#2b1a0e;--muted:#6b4f33;--accent:#8b1a1a;--accent2:#1f4a7a;--green:#3f6b2e;--blue:#1f4a7a;--pink:#a0522d;
  --panel:rgba(240,225,185,.84);--line:rgba(60,35,15,.6);--ink:#f6ebc8;--rad:4px;--pill:6px;--bw:3px;--bs:double;--shadow:0 8px 20px rgba(60,35,15,.3);--blur:2px;--grain:.12}
:root[data-wp=sketch]{
  --mono:"Segoe Print","Bradley Hand","Chalkboard SE","Marker Felt","Comic Sans MS",cursive;--fs:16px;
  --sky1:#fbfaf4;--text:#222;--muted:#666;--accent:#ff6b4a;--accent2:#4a7cff;--green:#3dbb7a;--blue:#4a7cff;--pink:#ff8fb1;
  --panel:rgba(255,254,248,.96);--line:#222;--ink:#fff;--rad:18px 6px 20px 8px/8px 18px 6px 20px;--pill:22px 8px 24px 10px/10px 22px 8px 24px;--bw:2px;--shadow:4px 4px 0 #222;--blur:0px;--grain:.05}
:root[data-wp=matrix] .hero h1{text-shadow:0 0 18px rgba(0,255,102,.55)}
:root[data-wp=cyber] .hero h1{text-shadow:2px 0 var(--accent),-2px 0 var(--accent2)}
:root[data-wp=artist] .hero h1{font-style:italic;font-weight:500}
:root[data-wp=medieval] .hero h1{font-variant:small-caps;letter-spacing:.01em}
:root[data-wp=minimal] .hero h1,:root[data-wp=artist] .hero h1,:root[data-wp=medieval] .hero h1,:root[data-wp=sketch] .hero h1,
:root[data-wp=minimal] .sect,:root[data-wp=artist] .sect,:root[data-wp=medieval] .sect,:root[data-wp=sketch] .sect{text-shadow:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);background:var(--sky1);font:var(--fs)/1.55 var(--mono);overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--ink)}
#wall{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#grain{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:var(--grain);mix-blend-mode:overlay}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none;opacity:.5}
:root[data-wp=matrix] #fx{display:block}

/* floating status bar */
#top{position:fixed;z-index:5;top:14px;left:50%;transform:translateX(-50%);width:min(1100px,calc(100% - 28px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:7px 10px;border-radius:var(--pill);
  background:var(--panel);border:var(--bw) var(--bs) var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));font-size:13px}
#top .l,#top .r{display:flex;gap:8px;align-items:center}
#top .r{justify-content:flex-end}
#wx{padding-left:10px;white-space:nowrap;font-size:13px}
#wx small{color:var(--muted);font-size:12px}
#clock{font-weight:600;letter-spacing:.04em}
#date{color:var(--muted)}
.pill{font:inherit;font-size:12px;color:var(--text);background:rgba(127,127,127,.14);border:0;border-radius:var(--pill);padding:5px 12px;cursor:pointer;transition:.15s}
.pill:hover,.pill:focus-visible{background-color:var(--accent);color:var(--ink);outline:none}
select.pill{appearance:none;-webkit-appearance:none;font-family:inherit;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.pill option{background:var(--sky1);color:var(--text)}
.hnr{margin:0 0 10px}
/* edit mode: a side drawer, so the page behind it updates live */
#ed{position:fixed;z-index:9;top:68px;right:14px;bottom:14px;width:min(540px,calc(100% - 28px));margin:0;display:flex;flex-direction:column}
#ed[hidden]{display:none}
#ed>header #edclose{margin-left:auto}
#edbody{flex:1;min-height:0;overflow:auto}
#edbody h3{margin:24px 0 8px;font-size:12px;font-weight:400;letter-spacing:.08em;color:var(--muted)}
#edbody h3:first-child{margin-top:0}
#edbody h3::before{content:"/ ";color:var(--accent)}
.fld{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.fld>span{color:var(--muted)}
.fld input[type=checkbox]{justify-self:start;accent-color:var(--accent);width:18px;height:18px}
.inl{display:flex;gap:6px}
.egrp{border:1px dashed var(--line);border-radius:min(var(--rad),10px);padding:10px;margin:10px 0}
.ghead{display:flex;gap:6px;margin-bottom:8px}
.ghead input{font-weight:700}
.lrow{display:grid;grid-template-columns:96px 1fr 84px auto;gap:6px;margin:5px 0;align-items:center}
.acts{display:flex;gap:0}
.mini{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 7px;border-radius:6px}
.mini:hover,.mini:focus-visible{color:var(--ink);background:var(--accent);outline:none}
#edbody input.bad{border-color:#ff5d5d!important}
#edbody .pill{margin:4px 6px 0 0}
#edbody textarea{height:120px;min-height:80px;font-size:12px}
#edbody .note{color:var(--muted);font-size:12px;margin:6px 0}
#edbody label.chk{display:inline-flex;gap:6px;align-items:center;margin:4px 14px 4px 0;font-size:13px;cursor:pointer}
#edbody label.chk input{accent-color:var(--accent)}
/* theme dropdown: styled by the active theme's variables, so hovering an entry (which previews that theme) restyles it too */
.tsel{position:relative}
#wpb{width:130px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
#wpb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wpb b{font-weight:400;opacity:.7}
#wpm{position:absolute;right:0;top:calc(100% + 10px);width:180px;margin:0;padding:6px;list-style:none;z-index:8;
  background:color-mix(in srgb,var(--sky1) 90%,transparent);border:var(--bw) var(--bs) var(--line);border-radius:var(--rad);
  box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);clip-path:var(--clip)}
#wpm li{display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 12px;border-radius:min(var(--rad),8px);cursor:pointer;font-size:13px;color:var(--text)}
#wpm li[aria-selected=true]::after{content:"✓";color:var(--accent)}
#wpm li:hover,#wpm li:focus{background:var(--accent);color:var(--ink);outline:none}
#wpm li:hover::after,#wpm li:focus::after{color:var(--ink)}

main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:86px 14px 120px}

/* windows */
.win{background:var(--panel);border:var(--bw) var(--bs) var(--line);border-radius:var(--rad);backdrop-filter:blur(var(--blur)) saturate(1.2);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.2);box-shadow:var(--shadow);clip-path:var(--clip);overflow:hidden;break-inside:avoid;margin-bottom:16px}
.win>header{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.win>header i{width:11px;height:11px;border-radius:50%;background:#ff6b6b}
.win>header i:nth-child(2){background:#ffcf5c}
.win>header i:nth-child(3){background:#5ad47a}
.win>header span{margin-left:8px}
.win>.body{padding:18px 20px 20px}

/* hero */
.hero{padding:6vh 0 4vh;text-align:center}
.hero h1{margin:0;font:600 clamp(2rem,6vw,4rem)/1.05 var(--head);letter-spacing:-.04em;text-shadow:0 4px 40px rgba(0,0,0,.35)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:10px 0 0;opacity:.8}
.sb{display:flex;align-items:center;gap:12px;margin:26px auto 0;max-width:640px;padding:6px 8px 6px 20px;border-radius:var(--pill);background:var(--panel);border:var(--bw) var(--bs) var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));transition:.2s}
#ask{margin-top:12px;max-width:520px;padding-top:3px;padding-bottom:3px}
#ask input{font-size:14px;padding:8px 0}
#ask b{color:var(--accent2)}
#ask button{background:var(--accent2)}
.tog{position:relative;flex:none;width:34px;height:34px;padding:0;display:grid;place-items:center;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:50%;cursor:pointer;transition:.15s}
.tog:hover{color:var(--text);background:rgba(127,127,127,.18)}
.tog::before,.tog::after{content:"";position:absolute;opacity:0;transition:.15s;pointer-events:none}
.tog::before{inset:2px;border:2px solid var(--accent);border-radius:50%}
.tog::after{left:50%;top:50%;width:2px;height:calc(100% - 4px);margin-left:-1px;margin-top:calc(-50% + 2px);background:var(--accent);transform:rotate(45deg)}
.tog[aria-pressed=true]{color:var(--text)}
.tog[aria-pressed=true]::before,.tog[aria-pressed=true]::after{opacity:1}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sb:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.sb b{color:var(--accent)}
.sb input{flex:1;min-width:0;font:inherit;font-size:16px;background:none;border:0;color:var(--text);padding:11px 0;outline:none}
.sb input::placeholder{color:var(--muted)}
.sb>button:not(.tog){font:inherit;border:0;border-radius:var(--pill);background:var(--accent);color:var(--ink);padding:9px 18px;cursor:pointer;font-weight:600}

/* links */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px}
.group h2{margin:0 0 10px;font-size:12px;font-weight:400;color:var(--muted)}
.group h2::before{content:"~/";color:var(--accent2)}
.group a{display:flex;align-items:center;gap:12px;padding:7px 10px;margin:0 -10px;border-radius:9px;transition:background .15s,transform .15s}
.group a:hover,.group a:focus-visible{background:rgba(127,127,127,.18);transform:translateX(4px);outline:none}
.g{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink);flex:none;background:var(--accent)}
.group a:nth-of-type(4n+2) .g{background:var(--accent2)}
.group a:nth-of-type(4n+3) .g{background:var(--green)}
.group a:nth-of-type(4n+4) .g{background:var(--blue)}
.g{position:relative;overflow:hidden}
.g b{font-weight:700}
.g img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;display:none}
.g.ic{background:rgba(255,255,255,.92)!important}
.g.ic b{visibility:hidden}
.g.ic img{display:block}
.group a span.n{flex:1}
.group a small{color:var(--muted);font-size:11px;opacity:0;transition:.15s}
.group a:hover small,.group a:focus-visible small{opacity:1}

.sect{display:flex;align-items:center;gap:12px;margin:34px 4px 14px;font-size:12px;color:var(--text);opacity:.8;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.widgets{columns:3 300px;column-gap:16px}
.big{font:700 3.2rem/1 var(--head);letter-spacing:-.05em}
.muted{color:var(--muted)}
.win ul{list-style:none;margin:0;padding:0}
.news li{padding:8px 0;border-bottom:1px dashed var(--line)}
.news li:last-child{border:0}
.news a:hover{color:var(--accent)}
.news small{display:block;color:var(--muted);font-size:11px}
textarea,.win input[type=text]{width:100%;font:inherit;color:var(--text);background:rgba(127,127,127,.12);border:1px solid transparent;border-radius:min(var(--rad),10px);padding:10px 12px;outline:none}
textarea:focus,.win input[type=text]:focus{border-color:var(--accent)}
textarea{min-height:140px;resize:vertical}
.todo li{display:flex;gap:10px;align-items:center;padding:5px 0}
.todo li span{flex:1}
.todo li.done span{text-decoration:line-through;color:var(--muted)}
.todo li button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit}
.todo input[type=checkbox]{accent-color:var(--accent)}
.empty{color:var(--muted);margin:0 0 6px}
.row{display:flex;gap:8px;margin-top:12px}
.bar-row{margin:12px 0}
.bar-row div{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.track{height:8px;border-radius:8px;background:rgba(127,127,127,.2);overflow:hidden}
.track i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent2),var(--accent))}

#panel{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9}
#panel.open{display:flex}
#panel .win{width:340px;max-width:90vw;margin:0;background:var(--sky1)}
#panel label{display:flex;gap:12px;padding:8px 0;cursor:pointer}
#panel input{accent-color:var(--accent)}
@media(max-width:700px){#date,#wx small{display:none}#wx{padding-left:4px}#wpb{width:104px}#ed{top:60px;right:8px;left:8px;width:auto}.lrow{grid-template-columns:1fr 1fr}.fld{grid-template-columns:84px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg id="wall" aria-hidden="true" preserveAspectRatio="xMidYMax slice" viewBox="0 0 1600 900"></svg>
<canvas id="fx" aria-hidden="true"></canvas>
<svg id="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 -.1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

<nav id="top">
  <div class="l"><span id="wx" title="weather"></span></div>
  <div><span id="clock"></span> <span id="date"></span></div>
  <div class="r"><div class="tsel"><button type="button" class="pill" id="wpb" aria-haspopup="listbox" aria-expanded="false" title="Theme"><span></span><b>▾</b></button><ul id="wpm" role="listbox" aria-label="Theme" hidden></ul></div><button class="pill" id="customize">widgets</button><button class="pill" id="editbtn" aria-expanded="false" aria-controls="ed">edit</button></div>
</nav>

<main>
  <section class="hero">
    <h1 id="greeting"></h1>
    <p id="sub"></p>
    <form id="search" class="sb" method="get"><b>❯</b><input id="q1" placeholder="search the web" autofocus autocomplete="off"><input type="hidden" name="q"><button type="button" id="noai" class="tog" aria-pressed="false" aria-label="Exclude AI-era results (before 2022 only)" title="Crossed out = only results from before 2022"><span>ai</span></button><button>go</button></form>
    <form id="ask" class="sb" method="get"><b>✦</b><input name="q" placeholder="ask perplexity" autocomplete="off"><button>ask</button></form>
  </section>

  <div class="win"><header><i></i><i></i><i></i><span>~/links</span></header><div class="body"><div class="cols" id="links"></div></div></div>

  <div class="sect">widgets</div>
  <section class="widgets" id="widgets"></section>
</main>

<div id="panel"><div class="win"><header><i></i><i></i><i></i><span>widgets.conf</span></header><div class="body"><div id="toggles"></div><div class="row"><button class="pill" id="close">done</button></div></div></div></div>

<aside id="ed" class="win" hidden aria-label="Edit settings"><header><i></i><i></i><i></i><span>edit · settings</span><button class="pill" id="edclose">close</button></header><div class="body" id="edbody"></div></aside>

<script src="setup.js"></script>
<script src="setup.local.js"></script><!-- optional local override -->
<script>
const $ = (s, r = document) => r.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem("dash." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("dash." + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isHttp = u => { try { return /^https?:$/.test(new URL(u).protocol); } catch { return false; } };
const normUrl = u => { u = String(u || "").trim(); if (!u) return ""; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u; return isHttp(u) ? u : ""; };

  name: "",
  searchUrl: "https://www.startpage.com/sp/search",
  askUrl: "https://www.perplexity.ai/search",
  noAiBefore: "2022-01-01",
  favicons: true,
  hnRange: "front",
  weather: { city: "Berlin", lat: 52.52, lon: 13.41 },
  greetings: {},
  links: {},
  defaultWidgets: ["news", "progress", "notes", "todo", "timer"]
};
const ALL_THEMES = ["dusk", "moss", "ink", "matrix", "minimal", "artist", "cyber", "medieval", "sketch"];
const DEFAULT_GREET = { night: "still up", morning: "good morning", afternoon: "good afternoon", evening: "good evening" };
let CONFIG, THEMES, GREET;
const edits = () => store.get("settings", {});
function buildConfig() {
  CONFIG = Object.assign({}, FALLBACK, window.SETUP, window.SETUP_LOCAL, edits());

/* bar + greeting */
function tick() {
  const d = new Date(), h = d.getHours(), p = n => String(n).padStart(2, "0");
  $("#clock").textContent = `${p(h)}:${p(d.getMinutes())}`;
  $("#date").textContent = "· " + d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  const g = h < 5 ? GREET.night : h < 12 ? GREET.morning : h < 18 ? GREET.afternoon : GREET.evening;
  $("#greeting").innerHTML = esc(g.charAt(0).toUpperCase() + g.slice(1)) + (CONFIG.name ? `, <em>${esc(CONFIG.name)}</em>` : "<em>.</em>");
  $("#sub").textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}
tick(); setInterval(tick, 1000);

/* weather lives in the top bar (not a widget) */
async function loadWx() {
  const { city, lat, lon } = CONFIG.weather, el = $("#wx");
  try {
    const j = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`)).json();
    const c = j.current.weather_code;
    const [icon, label] = c <= 1 ? ["☀", "clear"] : c === 2 ? ["⛅", "partly cloudy"] : c === 3 ? ["☁", "overcast"] : c < 50 ? ["≋", "fog"] : c < 70 || (c >= 80 && c < 90) ? ["☂", "rain"] : c < 80 ? ["❄", "snow"] : ["⚡", "thunderstorm"];
    el.innerHTML = `${icon} ${Math.round(j.current.temperature_2m)}° <small>${esc(label)} · ${esc(city.toLowerCase())}</small>`;
    el.title = `${city}: ${label}, high ${Math.round(j.daily.temperature_2m_max[0])}° / low ${Math.round(j.daily.temperature_2m_min[0])}°, wind ${Math.round(j.current.wind_speed_10m)} km/h`;
  } catch { el.textContent = ""; }
}
loadWx(); setInterval(loadWx, 15 * 60 * 1000);

/* themes: every theme's artwork is generated in code from its CSS variables (no image files).
   To add one: add a [data-wp=name] block in the CSS, a PAINT.name function below, and the name to `themes` in setup.js. */
const ridgeD = (c, base, amp, f) => {
  const p1 = c.rnd() * 6, p2 = c.rnd() * 6, p3 = c.rnd() * 6; let d = `M0 ${c.H}`;
  for (let x = 0; x <= c.W; x += 16) d += ` L${x} ${(base - amp * (Math.sin(x * f + p1) + .5 * Math.sin(x * f * 2.3 + p2) + .25 * Math.sin(x * f * 5.1 + p3))).toFixed(1)}`;
  return `${d} L${c.W} ${c.H}Z`;
};
const PAINT = {
  landscape(c) {
    const { v, rnd, W, H } = c;
    let s = `<defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${v("--sky1")}"/><stop offset=".55" stop-color="${v("--sky2")}"/><stop offset=".85" stop-color="${v("--sky3")}"/></linearGradient>
      <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${v("--sun1")}"/><stop offset="1" stop-color="${v("--sun2")}"/></linearGradient>
      <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${v("--sky3")}" stop-opacity=".55"/><stop offset=".5" stop-color="${v("--sky3")}" stop-opacity="0"/></linearGradient>
      <mask id="stripes"><rect width="${W}" height="${H}" fill="#fff"/>${Array.from({ length: 6 }, (_, i) => `<rect x="0" y="${400 + i * 24}" width="${W}" height="${2 + i * 2.4}" fill="#000"/>`).join("")}</mask>
      <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter></defs>
      <rect width="${W}" height="${H}" fill="url(#sky)"/>`;
    for (let i = 0; i < 90; i++) s += `<circle cx="${(rnd() * W).toFixed(0)}" cy="${(rnd() * 420).toFixed(0)}" r="${(.5 + rnd() * 1.4).toFixed(1)}" fill="${v("--star")}" opacity="${(.15 + rnd() * .6).toFixed(2)}"/>`;
    s += `<circle cx="1050" cy="440" r="200" fill="${v("--sun2")}" opacity=".35" filter="url(#blur)"/>

    [[560, 55, .0042, "--r0", .9], [640, 70, .0036, "--r1", .6], [720, 80, .0031, "--r2", .35], [790, 70, .0027, "--r3", .15], [860, 55, .0022, "--r4", 0]].forEach(([b, a, f, col, fog]) => {
      const d = ridgeD(c, b, a, f); s += `<path d="${d}" fill="${v(col)}"/><path d="${d}" fill="url(#fog)" opacity="${fog}"/>`;

          if (rnd() < .22) out += `<rect x="${wx | 0}" y="${wy | 0}" width="5" height="7" fill="${[cy, mag, yel][(rnd() * 3) | 0]}" opacity="${(.5 + rnd() * .5).toFixed(2)}"/>`;

         <line x1="140" y1="-2" x2="140" y2="-44" stroke="${dark}" stroke-width="3"/><polygon points="140,-44 178,-33 140,-22" fill="${v("--accent")}"/>
         <path d="M120 340 V205 a20 20 0 0 1 40 0 V340Z" fill="#e8d5a8" opacity=".22"/></g>

    let s = `<defs><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs>

const THEME_ART = { dusk: "landscape", moss: "landscape", ink: "landscape" };

/* matrix: falling code on a canvas, drawn with the theme's colors; returns a stop function */
function rain() {
  const cv = $("#fx"), cx = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  const col = cs.getPropertyValue("--accent").trim(), bg = cs.getPropertyValue("--sky1").trim();
  const size = 16, chars = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789";
  let w, h, drops, raf, last = 0;
  const reset = () => { w = cv.width = innerWidth; h = cv.height = innerHeight; cx.fillStyle = bg; cx.fillRect(0, 0, w, h); drops = Array.from({ length: Math.ceil(w / size) }, () => -Math.random() * 40); };
  const step = () => {
    cx.globalAlpha = .1; cx.fillStyle = bg; cx.fillRect(0, 0, w, h); cx.globalAlpha = 1;
    cx.font = `${size}px monospace`;
    drops.forEach((y, i) => {
      cx.fillStyle = Math.random() < .04 ? "#e8fff0" : col;
      cx.fillText(chars[(Math.random() * chars.length) | 0], i * size, y * size);
      drops[i] = y * size > h && Math.random() > .975 ? 0 : y + 1;
    });
  };
  const loop = t => { raf = requestAnimationFrame(loop); if (t - last > 55) { last = t; step(); } };
  addEventListener("resize", reset); reset();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) for (let i = 0; i < 160; i++) step(); else raf = requestAnimationFrame(loop);
  return () => { cancelAnimationFrame(raf); removeEventListener("resize", reset); cx.clearRect(0, 0, cv.width, cv.height); };
}
let stopFx = () => {};
function paint() {
  stopFx(); stopFx = () => {};
  const t = document.documentElement.dataset.wp, cs = getComputedStyle(document.documentElement);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const c = { v: n => cs.getPropertyValue(n).trim(), rnd, W: 1600, H: 900 };
  $("#wall").innerHTML = (PAINT[THEME_ART[t] || t] || PAINT.landscape)(c);
  if (t === "matrix") stopFx = rain();
}
const setWp = n => { document.documentElement.dataset.wp = n; paint(); };
/* theme dropdown: hovering (or arrowing to) an entry previews that theme, clicking applies it */
const menu = $("#wpm"), tbtn = $("#wpb");
let committed = THEMES[0], pt;
const buildMenu = () => { menu.innerHTML = THEMES.map(n => `<li role="option" tabindex="-1" data-t="${esc(n)}">${esc(n)}</li>`).join(""); };
buildMenu();
const lis = () => [...menu.querySelectorAll("li")];
const markCur = () => lis().forEach(li => li.setAttribute("aria-selected", li.dataset.t === committed));
const preview = n => { clearTimeout(pt); pt = setTimeout(() => { if (document.documentElement.dataset.wp !== n) setWp(n); }, 50); };
const openMenu = () => { menu.hidden = false; tbtn.setAttribute("aria-expanded", "true"); markCur(); menu.querySelector(`[data-t="${committed}"]`).focus(); };
const closeMenu = () => { if (menu.hidden) return; menu.hidden = true; tbtn.setAttribute("aria-expanded", "false"); preview(committed); };
const applyTheme = n => { committed = n; clearTimeout(pt); setWp(n); tbtn.firstElementChild.textContent = n; store.set("wp", n); markCur(); };
const commitWp = n => { applyTheme(n); closeMenu(); tbtn.focus(); };
tbtn.onclick = () => menu.hidden ? openMenu() : closeMenu();
menu.addEventListener("mouseover", e => { const li = e.target.closest("li"); if (li) { li.focus({ preventScroll: true }); preview(li.dataset.t); } });
menu.addEventListener("focusin", e => { const li = e.target.closest("li"); if (li) preview(li.dataset.t); });
menu.addEventListener("mouseleave", () => preview(committed));
menu.addEventListener("click", e => { const li = e.target.closest("li"); if (li) commitWp(li.dataset.t); });
menu.addEventListener("keydown", e => {
  const items = lis(), i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (i >= 0) commitWp(items[i].dataset.t); }
  else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(); tbtn.focus(); }
  else if (e.key === "Tab") closeMenu();
});
document.addEventListener("click", e => { if (!e.target.closest(".tsel")) closeMenu(); });

/* links */
function renderLinks() {
  $("#links").innerHTML = Object.entries(CONFIG.links || {}).map(([g, items]) =>
    `<div class="group"><h2>${esc(g)}</h2>${(items || []).map(([n, u, icon]) => {
      u = normUrl(u); if (!u) return "";
      const host = new URL(u).hostname.replace(/^www\./, ""), ic = icon && isHttp(icon) ? icon : new URL("/favicon.ico", u).href;
      const img = CONFIG.favicons ? `<img alt="" src="${esc(ic)}" onload="this.parentNode.classList.add('ic')" onerror="this.remove()">` : "";
      return `<a href="${esc(u)}"><span class="g"><b>${esc(String(n || "?")[0].toUpperCase())}</b>${img}</span><span class="n">${esc(n)}</span><small>${esc(host)}</small></a>`;
    }).join("")}</div>`).join("");
}
renderLinks();

/* widgets: each has a title, a window-title `file`, and a render(body) function. Add your own here. */

    b.innerHTML = `<select class="pill hnr" aria-label="Time range">${Object.entries(ranges).map(([k, [l]]) => `<option value="${k}"${k === range ? " selected" : ""}>${l}</option>`).join("")}</select><div class="hnl"></div>`;
    const list = $(".hnl", b);
    const load = async () => {
      list.innerHTML = `<div class="muted">loading…</div>`;
      try {

        if (range === "front") {   // the live front page
          const ids = (await (await fetch("https://hacker-news.firebaseio.com/v0/topstories.json")).json()).slice(0, 7);
          items = (await Promise.all(ids.map(i => fetch(`https://hacker-news.firebaseio.com/v0/item/${i}.json`).then(r => r.json()))))
            .map(i => ({ id: i.id, title: i.title, url: i.url, points: i.score, comments: i.descendants || 0 }));
        } else {                   // best stories of a time window (HN Algolia search)
          const since = Math.floor(Date.now() / 1000) - ranges[range][1];
          const j = await (await fetch(`https://hn.algolia.com/api/v1/search?tags=story&numericFilters=created_at_i%3E${since}&hitsPerPage=7`)).json();
          items = j.hits.map(h => ({ id: h.objectID, title: h.title, url: h.url, points: h.points || 0, comments: h.num_comments || 0 }));
        }
        list.innerHTML = items.length ? `<ul class="news">${items.map(i => `<li><a href="${esc(i.url || "https://news.ycombinator.com/item?id=" + i.id)}">${esc(i.title)}</a><small>${i.points} pts · ${i.comments} comments</small></li>`).join("")}</ul>` : `<div class="muted">nothing found</div>`;
      } catch { list.innerHTML = `<div class="muted">couldn't load (offline?)</div>`; }
    };
    $(".hnr", b).onchange = e => { range = e.target.value; store.set("hnrange", range); load(); };
    load();
  }},
  progress: { title: "Time progress", file: "uptime", render(b) {
    const draw = () => {
      const n = new Date(), y = n.getFullYear();
      const day = (n - new Date(y, 0, 0)) / 864e5, len = (new Date(y + 1, 0, 1) - new Date(y, 0, 1)) / 864e5;
      const wk = ((n.getDay() + 6) % 7 + (n.getHours() * 60 + n.getMinutes()) / 1440) / 7;
      const dy = (n.getHours() * 60 + n.getMinutes()) / 1440;
      const row = (l, x) => `<div class="bar-row"><div><span>${l}</span><span>${Math.floor(x * 100)}%</span></div><div class="track"><i style="width:${x * 100}%"></i></div></div>`;
      b.innerHTML = row("today", dy) + row("this week", wk) + row(String(y), day / len);
    };
    draw(); return setInterval(draw, 60000);
  }},
  notes: { title: "Notes", file: "notes.txt", render(b) {
    b.innerHTML = `<textarea placeholder="jot something down…"></textarea>`;
    const t = $("textarea", b); t.value = store.get("notes", "");
    t.oninput = () => store.set("notes", t.value);
  }},
  todo: { title: "To-do", file: "todo.md", render(b) {
    let items = store.get("todo", []);
    const draw = () => {
      b.innerHTML = `${items.length ? "" : `<p class="empty">nothing to do. enjoy it.</p>`}<ul class="todo">${items.map((t, i) => `<li class="${t.done ? "done" : ""}"><input type="checkbox" data-i="${i}" ${t.done ? "checked" : ""}><span>${esc(t.text)}</span><button data-x="${i}" aria-label="Delete">×</button></li>`).join("")}</ul><form class="row"><input type="text" placeholder="add a task…"></form>`;
      store.set("todo", items);
      b.querySelectorAll("[data-i]").forEach(c => c.onchange = () => { items[c.dataset.i].done = c.checked; draw(); });
      b.querySelectorAll("[data-x]").forEach(x => x.onclick = () => { items.splice(x.dataset.x, 1); draw(); });
      $("form", b).onsubmit = e => { e.preventDefault(); const v = $("input", e.target).value.trim(); if (v) { items.push({ text: v, done: false }); draw(); $("form input", b).focus(); } };
    };
    draw();
  }},
  timer: { title: "Focus timer", file: "pomodoro", render(b) {
    let left = 25 * 60, id = null;
    const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    b.innerHTML = `<div class="big" data-t>${fmt(left)}</div><div class="row"><button class="pill" data-go>start</button><button class="pill" data-reset>reset</button></div>`;
    const t = $("[data-t]", b), go = $("[data-go]", b);
    go.onclick = () => {
      if (id) { clearInterval(id); id = null; go.textContent = "start"; return; }
      go.textContent = "pause";
      id = setInterval(() => { t.textContent = fmt(--left); if (left <= 0) { clearInterval(id); id = null; go.textContent = "start"; left = 25 * 60; t.textContent = "done!"; } }, 1000);
    };
    $("[data-reset]", b).onclick = () => { clearInterval(id); id = null; left = 25 * 60; t.textContent = fmt(left); go.textContent = "start"; };
    return () => clearInterval(id);
  }}
};

/* widget manager */
let enabled = store.get("widgets", CONFIG.defaultWidgets);
const cleanups = {};
function renderWidgets() {
  const box = $("#widgets");
  Object.values(cleanups).forEach(c => c && clearInterval(c));
  box.innerHTML = "";
  for (const id of Object.keys(WIDGETS).filter(k => enabled.includes(k))) {
    const w = WIDGETS[id], el = document.createElement("div");
    el.className = "win"; el.id = "w-" + id;
    el.innerHTML = `<header><i></i><i></i><i></i><span>${esc(w.file)}</span></header><div class="body"></div>`;
    box.appendChild(el);
    const r = w.render($(".body", el));
    if (r && !r.then) cleanups[id] = r;
  }
  if (!enabled.length) box.innerHTML = `<div class="muted">no widgets enabled. click “widgets” to add some.</div>`;
}
$("#toggles").innerHTML = Object.entries(WIDGETS).map(([id, w]) => `<label><input type="checkbox" value="${id}"> ${esc(w.title)}</label>`).join("");
$("#toggles").onchange = () => {
  enabled = [...document.querySelectorAll("#toggles input:checked")].map(i => i.value);
  store.set("widgets", enabled); renderWidgets();
};
const sync = () => document.querySelectorAll("#toggles input").forEach(i => i.checked = enabled.includes(i.value));
$("#customize").onclick = () => { sync(); $("#panel").classList.add("open"); };
$("#close").onclick = () => $("#panel").classList.remove("open");
$("#panel").onclick = e => { if (e.target.id === "panel") $("#panel").classList.remove("open"); };

/* ---------- edit mode ---------- */
function applySettings(patch = {}) {
  buildConfig();
  const k = Object.keys(patch), all = !k.length, has = (...a) => a.some(x => k.includes(x));
  if (all || has("name", "greetings")) tick();
  if (all || has("searchUrl", "askUrl")) applyEndpoints();
  if (all || has("links", "favicons")) renderLinks();
  if (all || has("weather")) loadWx();
  if (all || has("themes")) { buildMenu(); if (!THEMES.includes(committed)) applyTheme(THEMES[0]); else markCur(); }
  if (has("hnRange")) { store.set("hnrange", CONFIG.hnRange); renderWidgets(); }
}
const ed = $("#ed"), edBody = $("#edbody");
let ov = edits();
const setOv = patch => { ov = Object.assign({}, ov, patch); store.set("settings", ov); applySettings(patch); };
const unsetOv = keys => { ov = Object.assign({}, ov); keys.forEach(k => delete ov[k]); store.set("settings", ov); applySettings(Object.fromEntries(keys.map(k => [k, 0]))); };
const groups = () => Object.entries(CONFIG.links || {}).map(([n, items]) => [n, (items || []).map(x => x.slice())]);
const saveGroups = gs => { const o = {}; gs.forEach(([n, items]) => { o[n] = items; }); setOv({ links: o }); };
const uniqueName = (gs, base) => { let n = base, i = 2; while (gs.some(([g]) => g === n)) n = `${base} ${i++}`; return n; };
const HN_OPTS = { front: "front page", hour: "top · past hour", day: "top · today", week: "top · this week", month: "top · this month" };
const GREET_KEYS = ["night", "morning", "afternoon", "evening"];
const effective = () => ({ name: CONFIG.name, searchUrl: CONFIG.searchUrl, askUrl: CONFIG.askUrl, noAiBefore: CONFIG.noAiBefore, favicons: !!CONFIG.favicons, hnRange: CONFIG.hnRange, weather: CONFIG.weather, themes: THEMES, greetings: GREET, links: CONFIG.links });
const exportText = () => `window.SETUP_LOCAL = ${JSON.stringify(effective(), null, 2)};\n`;
function sanitize(o) {
  const out = {};
  if (typeof o.name === "string") out.name = o.name;
  for (const k of ["searchUrl", "askUrl"]) if (isHttp(o[k])) out[k] = o[k];
  if (/^\d{4}-\d{2}-\d{2}$/.test(o.noAiBefore)) out.noAiBefore = o.noAiBefore;
  if (typeof o.favicons === "boolean") out.favicons = o.favicons;
  if (o.hnRange in HN_OPTS) out.hnRange = o.hnRange;
  if (o.weather && isFinite(o.weather.lat) && isFinite(o.weather.lon)) out.weather = { city: String(o.weather.city || ""), lat: +o.weather.lat, lon: +o.weather.lon };
  if (Array.isArray(o.themes)) { const t = o.themes.filter(x => ALL_THEMES.includes(x)); if (t.length) out.themes = t; }
  if (o.greetings && typeof o.greetings === "object") { out.greetings = {}; for (const k of GREET_KEYS) if (typeof o.greetings[k] === "string") out.greetings[k] = o.greetings[k]; }
  if (o.links && typeof o.links === "object") {
    out.links = {};
    for (const [g, items] of Object.entries(o.links)) if (Array.isArray(items))
      out.links[g] = items.filter(x => Array.isArray(x) && typeof x[0] === "string" && normUrl(x[1])).map(x => { const r = [x[0], normUrl(x[1])]; if (x[2] && isHttp(x[2])) r.push(x[2]); return r; });
  }
  return out;
}
function renderEd() {
  const c = CONFIG, sc = edBody.scrollTop, w = c.weather || FALLBACK.weather;
  const fld = (label, key, ph = "") => `<label class="fld"><span>${label}</span><input type="text" data-k="${key}" value="${esc(c[key] ?? "")}" placeholder="${esc(ph)}"></label>`;
  edBody.innerHTML = `
    <h3>general</h3>
    ${fld("name", "name")}
    ${fld("search url", "searchUrl", FALLBACK.searchUrl)}
    ${fld("ask url", "askUrl", FALLBACK.askUrl)}
    ${fld("no-ai before", "noAiBefore", "YYYY-MM-DD")}
    <label class="fld"><span>hn default</span><select class="pill" data-k="hnRange">${Object.entries(HN_OPTS).map(([k, l]) => `<option value="${k}"${k === c.hnRange ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    <label class="fld"><span>favicons</span><input type="checkbox" data-k="favicons"${c.favicons ? " checked" : ""}></label>
    <h3>greetings</h3>
    ${GREET_KEYS.map(k => `<label class="fld"><span>${k}</span><input type="text" data-g="${k}" value="${esc(GREET[k])}"></label>`).join("")}
    <h3>location (weather)</h3>
    <div class="fld"><span>find city</span><div class="inl"><input type="text" id="citysearch" placeholder="e.g. Halle"><button class="pill" data-act="geo">search</button></div></div>
    <div id="geores"></div>
    <label class="fld"><span>name</span><input type="text" data-w="city" value="${esc(w.city)}"></label>
    <label class="fld"><span>lat / lon</span><div class="inl"><input type="text" data-w="lat" value="${esc(w.lat)}"><input type="text" data-w="lon" value="${esc(w.lon)}"></div></label>
    <h3>links</h3>
    ${groups().map(([g, items], gi) => `<div class="egrp">
      <div class="ghead"><input type="text" data-gname="${gi}" value="${esc(g)}"><span class="acts"><button class="mini" data-act="gup" data-gi="${gi}" title="move up">↑</button><button class="mini" data-act="gdown" data-gi="${gi}" title="move down">↓</button><button class="mini" data-act="gdel" data-gi="${gi}" title="delete group">×</button></span></div>
      ${items.map(([n, u, icon], li) => `<div class="lrow" data-gi="${gi}" data-li="${li}"><input type="text" data-lf="0" value="${esc(n)}" placeholder="label"><input type="text" data-lf="1" value="${esc(u)}" placeholder="https://…"><input type="text" data-lf="2" value="${esc(icon || "")}" placeholder="icon url"><span class="acts"><button class="mini" data-act="lup" data-gi="${gi}" data-li="${li}" title="move up">↑</button><button class="mini" data-act="ldown" data-gi="${gi}" data-li="${li}" title="move down">↓</button><button class="mini" data-act="ldel" data-gi="${gi}" data-li="${li}" title="delete link">×</button></span></div>`).join("")}
      <button class="pill" data-act="addlink" data-gi="${gi}">+ link</button></div>`).join("")}
    <button class="pill" data-act="addgroup">+ group</button>
    <h3>themes in the dropdown</h3>
    <div>${ALL_THEMES.map(t => `<label class="chk"><input type="checkbox" data-th="${t}"${THEMES.includes(t) ? " checked" : ""}>${t}</label>`).join("")}</div>
    <h3>backup &amp; share</h3>
    <p class="note">Edits are saved in this browser and override setup.js / setup.local.js. To keep them in a file, export and save as <b>setup.local.js</b>.</p>
    <textarea id="bk" spellcheck="false" placeholder="export shows your settings here; paste JSON here and press import"></textarea>
    <div><button class="pill" data-act="export">export</button><button class="pill" data-act="copy">copy</button><button class="pill" data-act="download">download setup.local.js</button><button class="pill" data-act="import">import</button><button class="pill" data-act="reset">reset edits</button></div>
    <p class="note" id="bkmsg"></p>`;
  edBody.scrollTop = sc;
}
async function geoSearch() {
  const q = $("#citysearch", edBody).value.trim(), out = $("#geores", edBody);
  if (!q) return;
  out.textContent = "searching…";
  try {
    const j = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`)).json();
    out.innerHTML = (j.results || []).map(r => `<button class="pill" data-act="pick" data-city="${esc(r.name)}" data-lat="${r.latitude}" data-lon="${r.longitude}">${esc([r.name, r.admin1, r.country].filter(Boolean).join(", "))}</button>`).join("") || `<span class="note">nothing found</span>`;
  } catch { out.textContent = "couldn't search (offline?)"; }
}
edBody.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, gi = +b.dataset.gi, li = +b.dataset.li, gs = groups(), msg = t => { const m = $("#bkmsg", edBody); if (m) m.textContent = t; };
  const swap = (arr, i, j) => { if (j < 0 || j >= arr.length) return false; [arr[i], arr[j]] = [arr[j], arr[i]]; return true; };
  if (a === "gup" || a === "gdown") { if (swap(gs, gi, gi + (a === "gup" ? -1 : 1))) { saveGroups(gs); renderEd(); } }
  else if (a === "gdel") { if (confirm(`Delete the group "${gs[gi][0]}" and its links?`)) { gs.splice(gi, 1); saveGroups(gs); renderEd(); } }
  else if (a === "addgroup") { gs.push([uniqueName(gs, "new group"), []]); saveGroups(gs); renderEd(); }
  else if (a === "addlink") { gs[gi][1].push(["new link", "https://example.org"]); saveGroups(gs); renderEd(); }
  else if (a === "lup" || a === "ldown") { if (swap(gs[gi][1], li, li + (a === "lup" ? -1 : 1))) { saveGroups(gs); renderEd(); } }
  else if (a === "ldel") { gs[gi][1].splice(li, 1); saveGroups(gs); renderEd(); }
  else if (a === "geo") geoSearch();
  else if (a === "pick") { setOv({ weather: { city: b.dataset.city, lat: +b.dataset.lat, lon: +b.dataset.lon } }); renderEd(); }
  else if (a === "export") { const t = $("#bk", edBody); t.value = exportText(); t.select(); msg("Save this as setup.local.js next to index.html."); }
  else if (a === "copy") { const t = $("#bk", edBody); if (!t.value) t.value = exportText(); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => msg("copied"), () => { try { document.execCommand("copy"); msg("copied"); } catch { msg("press Ctrl/Cmd+C to copy"); } }); }
  else if (a === "download") { const url = URL.createObjectURL(new Blob([exportText()], { type: "text/javascript" })), l = document.createElement("a"); l.href = url; l.download = "setup.local.js"; l.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
  else if (a === "import") {
    const raw = $("#bk", edBody).value.trim().replace(/^window\.SETUP(?:_LOCAL)?\s*=\s*/, "").replace(/;\s*$/, "");
    let obj; try { obj = JSON.parse(raw); } catch { msg("couldn't read that. Paste JSON without comments."); return; }
    const clean = obj && typeof obj === "object" && !Array.isArray(obj) ? sanitize(obj) : {};
    if (!Object.keys(clean).length) { msg("nothing usable found"); return; }
    setOv(clean); renderEd(); msg("imported: " + Object.keys(clean).join(", "));
  }
  else if (a === "reset") { if (confirm("Discard all edits made in the page and go back to setup.js / setup.local.js?")) { ov = {}; try { localStorage.removeItem("dash.settings"); } catch {} applySettings(); renderEd(); } }
});
edBody.addEventListener("change", e => {
  const t = e.target, d = t.dataset, bad = () => t.classList.add("bad"), ok = () => t.classList.remove("bad");
  if (d.k) {
    const v = t.type === "checkbox" ? t.checked : t.value.trim();
    if (d.k === "searchUrl" || d.k === "askUrl") { if (v && !isHttp(v)) return bad(); ok(); if (!v) return unsetOv([d.k]); }
    if (d.k === "noAiBefore") { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return bad(); ok(); }
    setOv({ [d.k]: v });
  } else if (d.g) setOv({ greetings: Object.assign({}, CONFIG.greetings, { [d.g]: t.value }) });
  else if (d.w) {
    const w = Object.assign({}, CONFIG.weather); w[d.w] = d.w === "city" ? t.value : parseFloat(t.value);
    if (!isFinite(w.lat) || !isFinite(w.lon)) return bad(); ok(); setOv({ weather: w });
  } else if (d.gname !== undefined) {
    const gs = groups(), gi = +d.gname, name = t.value.trim();
    if (!name || gs.some((x, i) => i !== gi && x[0] === name)) return bad(); ok(); gs[gi][0] = name; saveGroups(gs);
  } else if (d.lf !== undefined) {
    const row = t.closest(".lrow"), gs = groups(), it = gs[+row.dataset.gi][1][+row.dataset.li], f = +d.lf;
    let v = t.value.trim();
    if (f === 0 && !v) return bad();
    if (f === 1) { v = normUrl(v); if (!v) return bad(); t.value = v; }
    if (f === 2 && v && !isHttp(v)) return bad();
    ok(); if (f === 2) { it.length = 2; if (v) it[2] = v; } else it[f] = v;
    saveGroups(gs);
  } else if (d.th) {
    const list = [...edBody.querySelectorAll("[data-th]:checked")].map(x => x.dataset.th);
    if (!list.length) { t.checked = true; return; }
    setOv({ themes: list });
  }
});
edBody.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "citysearch") { e.preventDefault(); geoSearch(); } });
const openEd = () => { renderEd(); ed.hidden = false; $("#editbtn").setAttribute("aria-expanded", "true"); };
const closeEd = () => { ed.hidden = true; $("#editbtn").setAttribute("aria-expanded", "false"); };
$("#editbtn").onclick = () => ed.hidden ? openEd() : closeEd();
$("#edclose").onclick = closeEd;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !ed.hidden) closeEd(); });

{ const saved = store.get("wp", THEMES[0]); committed = THEMES.includes(saved) ? saved : THEMES[0]; setWp(committed); tbtn.firstElementChild.textContent = committed; markCur(); }
renderWidgets();
