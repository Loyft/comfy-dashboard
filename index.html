<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e1b2e'/><circle cx='50' cy='46' r='24' fill='%23f5a97f'/><path d='M0 78 30 52 52 70 74 48 100 76V100H0Z' fill='%23181526'/></svg>">
<style>
/* The wallpaper is drawn in code (SVG) – no image files, nothing to license.
   Palettes live in the [data-wp] blocks below; add your own. */
:root,:root[data-wp=dusk]{
  --sky1:#1a1633;--sky2:#5b3f7a;--sky3:#f0936b;--sun1:#ffd08a;--sun2:#ff7b8a;
  --r0:#6d4a86;--r1:#52396f;--r2:#3a2a5a;--r3:#271d44;--r4:#171230;--star:#fff4e0;
  --text:#ece6f5;--muted:#a79fc0;--accent:#f5a97f;--accent2:#c6a0f6;--green:#a6e3a1;--blue:#8aadf4;--pink:#f5bde6;
  --panel:rgba(22,18,40,.62);--line:rgba(236,230,245,.14);--ink:#171230}
:root[data-wp=moss]{
  --sky1:#0e1a17;--sky2:#2f4a3c;--sky3:#d9b26f;--sun1:#f6e3a8;--sun2:#e0a458;
  --r0:#4d6b52;--r1:#3b5642;--r2:#2b4234;--r3:#1d3026;--r4:#111f19;--star:#f4eed6;
  --text:#e9efdf;--muted:#a3b39f;--accent:#e0b861;--accent2:#9fcf9a;--green:#b8d98b;--blue:#8fc1c9;--pink:#e8a79a;
  --panel:rgba(15,28,22,.64);--line:rgba(233,239,223,.15);--ink:#111f19}
:root[data-wp=ink]{
  --sky1:#e9dcc3;--sky2:#efc9a6;--sky3:#e98a68;--sun1:#c8402f;--sun2:#c8402f;
  --r0:#b5776b;--r1:#8f5a55;--r2:#6a4348;--r3:#472e38;--r4:#2c1d2a;--star:#fff;
  --text:#2b1d26;--muted:#6e5560;--accent:#b8321f;--accent2:#6a4a8c;--green:#4d7a46;--blue:#3b6ea5;--pink:#b8475f;
  --panel:rgba(250,240,224,.7);--line:rgba(43,29,38,.2);--ink:#fff}
:root{--mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;--head:var(--mono);--fs:14px;
  --rad:14px;--pill:999px;--bw:1px;--bs:solid;--shadow:0 18px 50px rgba(0,0,0,.28);--blur:16px;--clip:none;--grain:.14}

/* ---- more themes: each sets colors plus shape/type variables; its artwork is drawn in paint() ---- */
:root[data-wp=matrix]{
  --sky1:#000a03;--sky2:#001a08;--sky3:#003a14;--text:#b9ffc8;--muted:#5fae77;--accent:#00ff66;--accent2:#7dffb0;--green:#00ff66;--blue:#3be0a0;--pink:#9dffb8;
  --panel:rgba(0,12,4,.74);--line:rgba(0,255,102,.3);--ink:#001a08;--rad:2px;--pill:3px;--shadow:0 0 22px rgba(0,255,102,.14);--blur:3px;--grain:.06}
:root[data-wp=minimal]{
  --mono:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fs:14px;
  --sky1:#f7f7f4;--text:#141414;--muted:#7a7a75;--accent:#141414;--accent2:#555;--green:#8a8a85;--blue:#b3b3ad;--pink:#d4d4ce;
  --panel:rgba(255,255,255,.86);--line:#e2e2dc;--ink:#fff;--rad:8px;--pill:8px;--shadow:none;--blur:0px;--grain:0}
:root[data-wp=artist]{
  --mono:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--fs:16px;
  --sky1:#f3ead8;--text:#231a14;--muted:#7a6a5a;--accent:#d94f30;--accent2:#2b59c3;--green:#3a8f6b;--blue:#2b59c3;--pink:#e8a0b4;
  --panel:rgba(255,250,238,.82);--line:rgba(35,26,20,.24);--ink:#fff8ec;--rad:3px;--pill:4px;--shadow:7px 7px 0 rgba(35,26,20,.14);--blur:2px;--grain:.1}
:root[data-wp=cyber]{
  --sky1:#07030f;--text:#e7f7ff;--muted:#8aa0c8;--accent:#ff2bd6;--accent2:#00f0ff;--green:#f5ff3a;--blue:#00f0ff;--pink:#ff2bd6;
  --panel:rgba(12,6,28,.76);--line:rgba(0,240,255,.38);--ink:#07030f;--rad:0;--pill:0;--shadow:0 0 28px rgba(255,43,214,.16);--blur:6px;--grain:.08;
  --clip:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
:root[data-wp=medieval]{
  --mono:"Palatino Linotype",Palatino,"Book Antiqua","Iowan Old Style",Georgia,serif;--fs:16px;
  --sky1:#e8d5a8;--sky2:#d9bf86;--sky3:#c9a566;--text:#2b1a0e;--muted:#6b4f33;--accent:#8b1a1a;--accent2:#1f4a7a;--green:#3f6b2e;--blue:#1f4a7a;--pink:#a0522d;
  --panel:rgba(240,225,185,.84);--line:rgba(60,35,15,.6);--ink:#f6ebc8;--rad:4px;--pill:6px;--bw:3px;--bs:double;--shadow:0 8px 20px rgba(60,35,15,.3);--blur:2px;--grain:.12}
:root[data-wp=sketch]{
  --mono:"Segoe Print","Bradley Hand","Chalkboard SE","Marker Felt","Comic Sans MS",cursive;--fs:16px;
  --sky1:#fbfaf4;--text:#222;--muted:#666;--accent:#ff6b4a;--accent2:#4a7cff;--green:#3dbb7a;--blue:#4a7cff;--pink:#ff8fb1;
  --panel:rgba(255,254,248,.96);--line:#222;--ink:#fff;--rad:18px 6px 20px 8px/8px 18px 6px 20px;--pill:22px 8px 24px 10px/10px 22px 8px 24px;--bw:2px;--shadow:4px 4px 0 #222;--blur:0px;--grain:.05}
:root[data-wp=pond]{
  --mono:ui-rounded,"SF Pro Rounded","Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;--head:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--fs:15px;
  --sky1:#03120e;--sky2:#06261d;--sky3:#0c4a38;--text:#e6fff4;--muted:#8fc9b0;--accent:#3de0a8;--accent2:#e9d36a;--green:#6fe3a8;--blue:#4fd1c5;--pink:#e3a58a;
  --panel:rgba(3,20,16,.52);--line:rgba(120,255,200,.22);--ink:#03120e;--rad:18px;--pill:999px;--shadow:0 12px 44px rgba(0,0,0,.45),0 0 34px rgba(61,224,168,.07);--blur:20px;--grain:.07}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;pointer-events:none}
:root[data-wp=pond] #vid.ok{display:block}
:root[data-wp=pond] #vid{inset:auto;width:auto;height:auto;object-fit:fill}   /* size + position are set in layoutPond() so the search bars always sit right under the cat */
:root[data-wp=pond] .hero{padding-top:calc(var(--pond-top,34vh) + var(--pond-shift,0px))}
:root[data-wp=pond] #search{margin-top:0}
#vig{position:fixed;inset:0;z-index:0;display:none;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(0,12,9,0) 0%,rgba(0,12,9,.5) 100%),linear-gradient(rgba(0,10,8,.1),rgba(0,10,8,.5))}
:root[data-wp=pond] #vig{display:block}
/* pond: the greeting sits centered just under the top bar and types itself out */
#hello{display:none}
:root[data-wp=pond] #greeting,:root[data-wp=pond] #sub{display:none}
:root[data-wp=pond] #hello{display:block;position:fixed;z-index:4;left:50%;top:var(--pond-hello-top,72px);transform:translateX(-50%);color:var(--text);pointer-events:none;line-height:0}
/* the greeting is hand-lettered: single-stroke letters drawn as SVG paths (see HW below), written out stroke by stroke */
#hello svg{display:block;height:clamp(42px,4.6vw,56px);width:auto;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 7px rgba(61,224,168,.5)) drop-shadow(0 1px 6px rgba(0,0,0,.7))}
#hello path.em{stroke:var(--accent)}
#hello.writing path{stroke-dasharray:1 1.1;animation:draw var(--t,.2s) ease-in-out var(--d,0s) both}
@keyframes draw{0%{opacity:0;stroke-dashoffset:1.05}1%{opacity:1}100%{opacity:1;stroke-dashoffset:0}}
#hello.txt{font:italic 300 clamp(1.3rem,2.6vw,1.75rem)/1.15 var(--head);white-space:nowrap;text-shadow:0 0 22px rgba(61,224,168,.55),0 1px 12px rgba(0,0,0,.8);line-height:1.15}
#hello.txt em{font-style:normal;color:var(--accent)}
:root[data-wp=pond] #editbtn .pl{display:none}
/* pond: Hacker News becomes a hand-lettered sidebar on the left: no window, no background */
.hw{display:none}
.hw svg{display:block;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(0,0,0,.85)) drop-shadow(0 0 12px rgba(0,0,0,.5))}
:root[data-wp=pond] .hnr{display:none}
:root[data-wp=pond] .hw{display:block}
:root[data-wp=pond] .hw + .plain{display:none}
:root[data-wp=pond] .news li{border:0;padding:0 0 15px;opacity:.68;transition:opacity .35s ease}
:root[data-wp=pond] .news li:hover,:root[data-wp=pond] .news li:focus-within{opacity:1}
:root[data-wp=pond] .news a{display:block}
:root[data-wp=pond] .news small{display:none}   /* the sidebar shows titles only */
:root[data-wp=pond] #w-news{position:fixed;z-index:3;left:var(--hn-x,26px);top:var(--hn-y,var(--pond-hello-top,72px));width:304px;max-height:calc(100vh - var(--hn-y,var(--pond-hello-top,72px)) - 18px);margin:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;background:none;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;clip-path:none}
:root[data-wp=pond] #w-news::-webkit-scrollbar{display:none}
/* edit mode: "move" lets you drag the sidebar anywhere (the position is remembered) */
:root.hndrag[data-wp=pond] #w-news{outline:1.5px dashed var(--accent);outline-offset:8px;cursor:grab;user-select:none;touch-action:none;z-index:6}
:root.hndrag[data-wp=pond] #w-news.dragging{cursor:grabbing}
:root.hndrag[data-wp=pond] #w-news a{pointer-events:none}
:root.hndrag[data-wp=pond] #w-github{outline:1.5px dashed var(--accent);outline-offset:8px;cursor:grab;user-select:none;touch-action:none;z-index:6}
:root.hndrag[data-wp=pond] #w-github.dragging{cursor:grabbing}
:root.hndrag[data-wp=pond] #w-github a{pointer-events:none}
/* only Hacker News enabled: no widgets divider, and the page is fitted to the window (no scrollbar) */
:root[data-wp=pond].hnonly .sect{display:none}
:root.pondfit,:root.pondfit body{height:100%;overflow:hidden}
:root.pondfit main{padding-bottom:16px}
:root.pondfit .hero{padding-bottom:10px}
:root[data-wp=pond].hnonly #linksbox>header{padding:calc(10px * var(--fit,1)) 14px}
:root[data-wp=pond].hnonly #linksbox>.body{padding:calc(18px * var(--fit,1)) 20px calc(20px * var(--fit,1))}
:root[data-wp=pond].hnonly #linksbox .group h2{margin-bottom:calc(10px * var(--fit,1))}
:root[data-wp=pond].hnonly #linksbox .group a{padding:calc(7px * var(--fit,1)) 10px;font-size:calc(14px * var(--fit,1))}
:root[data-wp=pond].hnonly #linksbox .g{width:calc(26px * var(--fit,1));height:calc(26px * var(--fit,1));font-size:calc(13px * var(--fit,1))}
:root[data-wp=pond] #w-news>header{display:none}
:root[data-wp=pond] #w-news>.body{padding:0}
@media(min-width:1180px){:root[data-wp=pond].hnside:not(.hnfree) #linksbox,:root[data-wp=pond].hnside:not(.hnfree) .sect,:root[data-wp=pond].hnside:not(.hnfree) .widgets{margin-left:max(0px,calc(268px - (100vw - 1100px) / 2))}}
@media(max-width:1179px){:root[data-wp=pond]:not(.hnfree) #w-news{position:static;width:auto;max-height:none;overflow:visible}}
/* pond: GitHub commits become a hand-lettered sidebar on the right, the mirror of the Hacker News one (hidden in the other themes) */
#w-github{display:none}
:root[data-wp=pond] #w-github{display:block;position:fixed;z-index:3;left:var(--gh-x,calc(100vw - 350px));top:var(--gh-y,var(--pond-hello-top,72px));width:324px;max-height:calc(100vh - var(--gh-y,var(--pond-hello-top,72px)) - 18px);margin:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;background:none;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;clip-path:none}
:root[data-wp=pond] #w-github::-webkit-scrollbar{display:none}
:root[data-wp=pond] #w-github>header{display:none}
:root[data-wp=pond] #w-github>.body{padding:0}
:root[data-wp=pond] .news.ghc li{padding:0 0 15px}
.ghr{position:relative;padding:0 28px 0 30px}
:root[data-wp=pond] .ghr .hnv{top:0;bottom:0}
.ghb{position:absolute;right:2px;top:0;bottom:0;display:flex;align-items:center;padding:0;border:0;background:none;color:var(--accent);cursor:pointer;opacity:0;transition:opacity .35s ease;filter:drop-shadow(0 0 5px rgba(0,0,0,.85))}
.news li:hover .ghb,.news li:focus-within .ghb,.news li.open .ghb{opacity:1}
@media(hover:none){.ghb{opacity:.8}}
:root.hndrag .ghb{pointer-events:none}
.ghd{margin:6px 0 0 30px;font-size:12px;line-height:1.45;text-align:right;white-space:pre-wrap;color:#fff;opacity:.8;text-shadow:0 0 6px rgba(0,0,0,.85)}
.ghd[hidden]{display:none}
:root[data-wp=pond] .ghc a{text-align:right}
:root[data-wp=pond] .ghc .hw svg{margin-left:auto}
.ghc .hnv{width:24px}
:root[data-wp=pond] .ghc small{display:block;margin-top:2px;font-size:11px;color:#fff;opacity:.45;text-shadow:0 0 6px rgba(0,0,0,.85)}
.ghg{display:block;width:266px;margin:10px 28px 0 auto;fill:var(--accent);filter:drop-shadow(0 0 5px rgba(0,0,0,.6))}
.ghm{margin-top:6px;padding-right:28px;text-align:right;font-size:11px;color:#fff;opacity:.5;text-shadow:0 0 6px rgba(0,0,0,.85)}
@media(min-width:1180px){:root[data-wp=pond].ghside:not(.ghfree) .widgets,:root[data-wp=pond].ghside:not(.ghfree) #linksbox,:root[data-wp=pond].ghside:not(.ghfree) .sect{margin-right:max(0px,calc(338px - (100vw - 1100px) / 2))}}
@media(max-width:1179px){:root[data-wp=pond]:not(.ghfree) #w-github{position:static;width:auto;max-height:none;overflow:visible}}
:root[data-wp=pond] .group a:hover,:root[data-wp=pond] .group a:focus-visible{box-shadow:0 0 22px rgba(61,224,168,.18)}
#motes{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
:root[data-wp=pond] #motes{display:block}
:root[data-wp=matrix] .hero h1{text-shadow:0 0 18px rgba(0,255,102,.55)}
:root[data-wp=cyber] .hero h1{text-shadow:2px 0 var(--accent),-2px 0 var(--accent2)}
:root[data-wp=artist] .hero h1{font-style:italic;font-weight:500}
:root[data-wp=medieval] .hero h1{font-variant:small-caps;letter-spacing:.01em}
:root[data-wp=minimal] .hero h1,:root[data-wp=artist] .hero h1,:root[data-wp=medieval] .hero h1,:root[data-wp=sketch] .hero h1,
:root[data-wp=minimal] .sect,:root[data-wp=artist] .sect,:root[data-wp=medieval] .sect,:root[data-wp=sketch] .sect{text-shadow:none}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);background:var(--sky1);font:var(--fs)/1.55 var(--mono);overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--ink)}
#wall{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#grain{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:var(--grain);mix-blend-mode:overlay}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none;opacity:.5}
:root[data-wp=matrix] #fx{display:block}

/* floating status bar */
#top{position:fixed;z-index:5;top:14px;left:50%;transform:translateX(-50%);width:min(1100px,calc(100% - 28px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:7px 10px;border-radius:var(--pill);
  background:var(--panel);border:var(--bw) var(--bs) var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));font-size:13px}
#top .l,#top .r{display:flex;gap:8px;align-items:center}
#top .r{justify-content:flex-end}
#wx{padding-left:10px;white-space:nowrap;font-size:13px}
#wx small{color:var(--muted);font-size:12px}
#clock{font-weight:600;letter-spacing:.04em}
#date{color:var(--muted)}
.pill{font:inherit;font-size:12px;color:var(--text);background:rgba(127,127,127,.14);border:0;border-radius:var(--pill);padding:5px 12px;cursor:pointer;transition:.15s}
.pill:hover,.pill:focus-visible{background-color:var(--accent);color:var(--ink);outline:none}
.pill.ic{display:inline-flex;align-items:center;justify-content:center;padding:6px 9px}
select.pill{appearance:none;-webkit-appearance:none;font-family:inherit;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.pill option{background:var(--sky1);color:var(--text)}
.hnr{margin:0 0 10px}
/* edit mode: a side drawer, so the page behind it updates live */
#ed{position:fixed;z-index:9;top:68px;right:14px;bottom:14px;width:min(540px,calc(100% - 28px));margin:0;display:flex;flex-direction:column}
#ed[hidden]{display:none}
#eddone{display:none}
/* while moving the sidebars the settings panel shrinks to a small bar at the bottom so it never covers them */
:root.hndrag #ed{top:auto;right:auto;left:50%;bottom:14px;width:auto;transform:translateX(-50%)}
:root.hndrag #edbody{display:none}
:root.hndrag #eddone{display:inline-block;margin-left:14px}
#ed>header #edclose{margin-left:auto}
#edbody{flex:1;min-height:0;overflow:auto}
#edbody h3{margin:24px 0 8px;font-size:12px;font-weight:400;letter-spacing:.08em;color:var(--muted)}
#edbody h3:first-child{margin-top:0}
#edbody h3::before{content:"/ ";color:var(--accent)}
.fld{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.fld>span{color:var(--muted)}
.fld input[type=checkbox]{justify-self:start;accent-color:var(--accent);width:18px;height:18px}
.inl{display:flex;gap:6px}
.egrp{border:1px dashed var(--line);border-radius:min(var(--rad),10px);padding:10px;margin:10px 0}
.ghead{display:flex;gap:6px;margin-bottom:8px}
.ghead input{font-weight:700}
.lrow{display:grid;grid-template-columns:96px 1fr 84px auto;gap:6px;margin:5px 0;align-items:center}
.acts{display:flex;gap:0}
.mini{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 7px;border-radius:6px}
.mini:hover,.mini:focus-visible{color:var(--ink);background:var(--accent);outline:none}
#edbody input.bad{border-color:#ff5d5d!important}
#edbody .pill{margin:4px 6px 0 0}
#edbody textarea{height:120px;min-height:80px;font-size:12px}
#edbody .note{color:var(--muted);font-size:12px;margin:6px 0}
#edbody label.chk{display:inline-flex;gap:6px;align-items:center;margin:4px 14px 4px 0;font-size:13px;cursor:pointer}
#edbody label.chk input{accent-color:var(--accent)}
/* theme dropdown: styled by the active theme's variables, so hovering an entry (which previews that theme) restyles it too */
.tsel{position:relative}
#wpb{width:130px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
#wpb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wpb b{font-weight:400;opacity:.7}
#wpm{position:absolute;right:0;top:calc(100% + 10px);width:180px;margin:0;padding:6px;list-style:none;z-index:8;
  background:color-mix(in srgb,var(--sky1) 90%,transparent);border:var(--bw) var(--bs) var(--line);border-radius:var(--rad);
  box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);clip-path:var(--clip)}
#wpm li{display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 12px;border-radius:min(var(--rad),8px);cursor:pointer;font-size:13px;color:var(--text)}
#wpm li[aria-selected=true]::after{content:"✓";color:var(--accent)}
#wpm li:hover,#wpm li:focus{background:var(--accent);color:var(--ink);outline:none}
#wpm li:hover::after,#wpm li:focus::after{color:var(--ink)}

main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:86px 14px 120px}

/* windows */
.win{background:var(--panel);border:var(--bw) var(--bs) var(--line);border-radius:var(--rad);backdrop-filter:blur(var(--blur)) saturate(1.2);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.2);box-shadow:var(--shadow);clip-path:var(--clip);overflow:hidden;break-inside:avoid;margin-bottom:16px}
.win>header{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.win>header i{width:11px;height:11px;border-radius:50%;background:#ff6b6b}
.win>header i:nth-child(2){background:#ffcf5c}
.win>header i:nth-child(3){background:#5ad47a}
.win>header span{margin-left:8px}
.win>.body{padding:18px 20px 20px}

/* hero */
.hero{padding:6vh 0 4vh;text-align:center}
.hero h1{margin:0;font:600 clamp(2rem,6vw,4rem)/1.05 var(--head);letter-spacing:-.04em;text-shadow:0 4px 40px rgba(0,0,0,.35)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:10px 0 0;opacity:.8}
.sb{display:flex;align-items:center;gap:12px;margin:26px auto 0;max-width:640px;padding:6px 8px 6px 20px;border-radius:var(--pill);background:var(--panel);border:var(--bw) var(--bs) var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));transition:.2s}
#ask{margin-top:12px;max-width:520px;padding:5px 6px 5px 20px}
#ask input{font-size:14px;padding:6px 0}
#ask>button{padding:6px 16px;font-size:13px}
#ask b{color:var(--accent2)}
#ask button{background:var(--accent2)}
.tog{position:relative;flex:none;width:34px;height:34px;padding:0;display:grid;place-items:center;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:50%;cursor:pointer;transition:.15s}
.tog:hover{color:var(--text);background:rgba(127,127,127,.18)}
.tog::before,.tog::after{content:"";position:absolute;opacity:0;transition:.15s;pointer-events:none}
.tog::before{inset:2px;border:2px solid var(--accent);border-radius:50%}
.tog::after{left:50%;top:50%;width:2px;height:calc(100% - 4px);margin-left:-1px;margin-top:calc(-50% + 2px);background:var(--accent);transform:rotate(45deg)}
.tog[aria-pressed=true]{color:var(--text)}
.tog[aria-pressed=true]::before,.tog[aria-pressed=true]::after{opacity:1}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sb:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.sb b{color:var(--accent)}
.sb input{flex:1;min-width:0;font:inherit;font-size:16px;background:none;border:0;color:var(--text);padding:11px 0;outline:none}
.sb input::placeholder{color:var(--muted)}
.sb>button:not(.tog){font:inherit;border:0;border-radius:var(--pill);background:var(--accent);color:var(--ink);padding:9px 18px;cursor:pointer;font-weight:600}

/* links */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px}
.group h2{margin:0 0 10px;font-size:12px;font-weight:400;color:var(--muted)}
.group h2::before{content:"~/";color:var(--accent2)}
.group a{display:flex;align-items:center;gap:12px;padding:7px 10px;margin:0 -10px;border-radius:9px;transition:background .15s,transform .15s}
.group a:hover,.group a:focus-visible{background:rgba(127,127,127,.18);transform:translateX(4px);outline:none}
.g{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink);flex:none;background:var(--accent)}
.group a:nth-of-type(4n+2) .g{background:var(--accent2)}
.group a:nth-of-type(4n+3) .g{background:var(--green)}
.group a:nth-of-type(4n+4) .g{background:var(--blue)}
.g{position:relative;overflow:hidden}
.g b{font-weight:700}
.g img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;display:none}
.g.ic{background:rgba(255,255,255,.92)!important}
.g.ic b{visibility:hidden}
.g.ic img{display:block}
.group a span.n{flex:1}
.group a small{color:var(--muted);font-size:11px;opacity:0;transition:.15s}
.group a:hover small,.group a:focus-visible small{opacity:1}

.sect{display:flex;align-items:center;gap:12px;margin:34px 4px 14px;font-size:12px;color:var(--text);opacity:.8;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.widgets{columns:3 300px;column-gap:16px}
.big{font:700 3.2rem/1 var(--head);letter-spacing:-.05em}
.muted{color:var(--muted)}
.win ul{list-style:none;margin:0;padding:0}
.news li{padding:8px 0;border-bottom:1px dashed var(--line)}
.news li:last-child{border:0}
:root:not([data-wp=pond]) .news a:hover{color:var(--accent)}
.news li{position:relative}
.news li{padding-right:24px;padding-left:52px}
.news .hnv{position:absolute;left:0;top:8px;bottom:8px;width:28px;display:flex;align-items:center;justify-content:flex-end;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);opacity:.55;pointer-events:none}
.news .hnc{position:absolute;right:0;top:8px;bottom:8px;display:flex;align-items:center;line-height:0;color:var(--accent);opacity:0;transition:opacity .35s ease}
.news li:hover .hnc,.news li:focus-within .hnc{opacity:1}
@media(hover:none){.news .hnc{opacity:.8}}
:root[data-wp=pond] .news li{padding-right:0;padding-left:52px}
:root[data-wp=pond] .news .hnv{top:0;bottom:15px;font-size:12px;color:var(--accent);opacity:.4;transition:opacity .35s ease;text-shadow:0 0 6px rgba(0,0,0,.85)}
:root[data-wp=pond] .news li:hover .hnv,:root[data-wp=pond] .news li:focus-within .hnv{opacity:1}
:root[data-wp=pond] .news .hnc{display:flex;top:0;bottom:15px;right:2px;filter:drop-shadow(0 0 5px rgba(0,0,0,.85))}
:root.hndrag .news .hnc{pointer-events:none}
.news small{display:block;color:var(--muted);font-size:11px}
textarea,.win input[type=text]{width:100%;font:inherit;color:var(--text);background:rgba(127,127,127,.12);border:1px solid transparent;border-radius:min(var(--rad),10px);padding:10px 12px;outline:none}
textarea:focus,.win input[type=text]:focus{border-color:var(--accent)}
textarea{min-height:140px;resize:vertical}
.todo li{display:flex;gap:10px;align-items:center;padding:5px 0}
.todo li span{flex:1}
.todo li.done span{text-decoration:line-through;color:var(--muted)}
.todo li button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit}
.todo input[type=checkbox]{accent-color:var(--accent)}
.empty{color:var(--muted);margin:0 0 6px}
.row{display:flex;gap:8px;margin-top:12px}
.bar-row{margin:12px 0}
.bar-row div{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.track{height:8px;border-radius:8px;background:rgba(127,127,127,.2);overflow:hidden}
.track i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent2),var(--accent))}

#panel{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9}
#panel.open{display:flex}
#panel .win{width:340px;max-width:90vw;margin:0;background:var(--sky1)}
#panel label{display:flex;gap:12px;padding:8px 0;cursor:pointer}
#panel input{accent-color:var(--accent)}
@media(max-width:700px){#date,#wx small{display:none}#wx{padding-left:4px}#wpb{width:104px}#ed{top:60px;right:8px;left:8px;width:auto}.lrow{grid-template-columns:1fr 1fr}.fld{grid-template-columns:84px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

  else if (a === "pick") { setOv({ weather: { city: b.dataset.city, lat: +b.dataset.lat, lon: +b.dataset.lon } }); renderEd(); }
  else if (a === "hnmove") { const on = document.documentElement.classList.toggle("hndrag"); b.textContent = on ? "done moving" : "move them"; b.setAttribute("aria-pressed", on); msg(on ? "Drag the Hacker News and GitHub lists on the page (pond theme)." : ""); }
  else if (a === "ghreset") { document.documentElement.classList.remove("hndrag"); unsetOv(["pondGhPos"]); renderEd(); }
  else if (a === "shiftreset") { unsetOv(["pondShift"]); renderEd(); }
  else if (a === "hnreset") { document.documentElement.classList.remove("hndrag"); unsetOv(["pondHnPos"]); renderEd(); }
  else if (a === "export") { const t = $("#bk", edBody); t.value = exportText(); t.select(); msg("Save this as setup.local.js next to index.html."); }
  else if (a === "copy") { const t = $("#bk", edBody); if (!t.value) t.value = exportText(); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => msg("copied"), () => { try { document.execCommand("copy"); msg("copied"); } catch { msg("press Ctrl/Cmd+C to copy"); } }); }
  else if (a === "download") { const url = URL.createObjectURL(new Blob([exportText()], { type: "text/javascript" })), l = document.createElement("a"); l.href = url; l.download = "setup.local.js"; l.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
  else if (a === "import") {
    const raw = $("#bk", edBody).value.trim().replace(/^window\.SETUP(?:_LOCAL)?\s*=\s*/, "").replace(/;\s*$/, "");
    let obj; try { obj = JSON.parse(raw); } catch { msg("couldn't read that. Paste JSON without comments."); return; }
    const clean = obj && typeof obj === "object" && !Array.isArray(obj) ? sanitize(obj) : {};
    if (!Object.keys(clean).length) { msg("nothing usable found"); return; }
    setOv(clean); renderEd(); msg("imported: " + Object.keys(clean).join(", "));
  }
  else if (a === "reset") { if (confirm("Discard all edits made in the page and go back to setup.js / setup.local.js?")) { ov = {}; try { localStorage.removeItem("dash.settings"); } catch {} applySettings(); renderEd(); } }
});
edBody.addEventListener("input", e => { if (e.target.type === "range" && e.target.dataset.k === "pondShift") setOv({ pondShift: +e.target.value }); });
edBody.addEventListener("change", e => {
  const t = e.target, d = t.dataset, bad = () => t.classList.add("bad"), ok = () => t.classList.remove("bad");
  if (d.k) {
    const v = t.type === "checkbox" ? t.checked : t.type === "range" ? +t.value : t.value.trim();
    if (d.k === "searchUrl" || d.k === "askUrl") { if (v && !isHttp(v)) return bad(); ok(); if (!v) return unsetOv([d.k]); }
    if (d.k === "noAiBefore") { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return bad(); ok(); }
    setOv({ [d.k]: v });
  } else if (d.g) setOv({ greetings: Object.assign({}, CONFIG.greetings, { [d.g]: t.value }) });
  else if (d.w) {
    const w = Object.assign({}, CONFIG.weather); w[d.w] = d.w === "city" ? t.value : parseFloat(t.value);
    if (!isFinite(w.lat) || !isFinite(w.lon)) return bad(); ok(); setOv({ weather: w });
  } else if (d.gname !== undefined) {
    const gs = groups(), gi = +d.gname, name = t.value.trim();
    if (!name || gs.some((x, i) => i !== gi && x[0] === name)) return bad(); ok(); gs[gi][0] = name; saveGroups(gs);
  } else if (d.lf !== undefined) {
    const row = t.closest(".lrow"), gs = groups(), it = gs[+row.dataset.gi][1][+row.dataset.li], f = +d.lf;
    let v = t.value.trim();
    if (f === 0 && !v) return bad();
    if (f === 1) { v = normUrl(v); if (!v) return bad(); t.value = v; }
    if (f === 2 && v && !isHttp(v)) return bad();
    ok(); if (f === 2) { it.length = 2; if (v) it[2] = v; } else it[f] = v;
    saveGroups(gs);
  } else if (d.th) {
    const list = [...edBody.querySelectorAll("[data-th]:checked")].map(x => x.dataset.th);
    if (!list.length) { t.checked = true; return; }
    setOv({ themes: list });
  }
});
edBody.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "citysearch") { e.preventDefault(); geoSearch(); } });
(() => {   // dragging the sidebars (only while "move them" is on in edit mode)
  let drag = null;
  const side = n => Object.keys(SIDES).find(id => n.matches(SIDES[id].sel));
  document.addEventListener("pointerdown", e => {
    const root = document.documentElement, n = e.target.closest("#w-news, #w-github");
    if (!n || !root.classList.contains("hndrag") || root.dataset.wp !== "pond") return;
    const r = n.getBoundingClientRect(); drag = { n, id: side(n), dx: e.clientX - r.left, dy: e.clientY - r.top, x: r.left, y: r.top };
    n.classList.add("dragging"); n.setPointerCapture(e.pointerId); e.preventDefault();
  });
  document.addEventListener("pointermove", e => {
    if (!drag) return;
    const S = SIDES[drag.id];
    drag.x = Math.min(Math.max(0, e.clientX - drag.dx), Math.max(0, innerWidth - S.w)); drag.y = Math.min(Math.max(0, e.clientY - drag.dy), Math.max(0, innerHeight - 60));
    const root = document.documentElement; root.style.setProperty(`--${drag.id}-x`, drag.x + "px"); root.style.setProperty(`--${drag.id}-y`, drag.y + "px"); root.classList.add(S.cls);
  });
  const end = () => { if (!drag) return; drag.n.classList.remove("dragging"); setOv({ [SIDES[drag.id].key]: { x: +(drag.x / innerWidth).toFixed(4), y: +(drag.y / innerHeight).toFixed(4) } }); drag = null; };
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
})();
const openEd = () => { renderEd(); ed.hidden = false; $("#editbtn").setAttribute("aria-expanded", "true"); };
const closeEd = () => { document.documentElement.classList.remove("hndrag"); ed.hidden = true; $("#editbtn").setAttribute("aria-expanded", "false"); };
$("#eddone").onclick = () => { document.documentElement.classList.remove("hndrag"); renderEd(); };
$("#editbtn").onclick = () => ed.hidden ? openEd() : closeEd();
$("#edclose").onclick = closeEd;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !ed.hidden) closeEd(); });

applyHnPos(); applyShift();
{ const saved = store.get("wp", THEMES[0]); committed = THEMES.includes(saved) ? saved : THEMES[0]; setWp(committed); tbtn.firstElementChild.textContent = committed; markCur(); }
renderWidgets();
